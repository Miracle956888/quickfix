<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickKit — free, simple online tools for everyday tasks. Percentage, discount, word count, text formatting, dates and unit conversion. Instant answers, no sign-up." />
    <meta name="theme-color" content="#7047EB" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuickKit" />
    <meta property="og:title" content="QuickKit — Everyday tools. Instant answers." />

    <link rel="canonical" href="https://quickkit.pages.dev/" />
    <title>QuickKit — Everyday tools. Instant answers.</title>
    <script>
      // Prevent flash of wrong theme: run before first paint.
      (function(){try{var t=localStorage.getItem('quickkit-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.dataset.theme='light';}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
